<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Hunt OS — Pipeline</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#1c1b1a; --sub:#6b6863; --line:#e6e3dd;
    --accent:#3d5afe; --accent-soft:#eef0ff;
    --stage-researching:#9aa0a6; --stage-applied:#3d5afe; --stage-screen:#8a5cf6;
    --stage-interview:#f5a524; --stage-final:#f5548c; --stage-offer:#22c55e; --stage-closed:#c9c5be;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17151a; --card:#211f26; --ink:#f0eee6; --sub:#a29e97; --line:#332f38;
      --accent:#8ba4ff; --accent-soft:#252347;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17151a; --card:#211f26; --ink:#f0eee6; --sub:#a29e97; --line:#332f38;
    --accent:#8ba4ff; --accent-soft:#252347;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{padding:24px 28px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;font-weight:650}
  header p{margin:2px 0 0;color:var(--sub);font-size:13px}
  .badge{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
  #board{display:flex;gap:14px;padding:8px 28px 28px;overflow-x:auto}
  .col{flex:0 0 260px;min-width:260px;display:flex;flex-direction:column;gap:10px}
  .col-head{display:flex;align-items:center;gap:8px;padding:0 2px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .col-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin:0;font-weight:650}
  .count{margin-left:auto;font-size:12px;color:var(--sub)}
  .cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;cursor:default}
  .card .company{font-weight:650;font-size:13.5px}
  .card .role{color:var(--sub);font-size:12.5px;margin-top:2px}
  .card .meta{margin-top:8px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);gap:8px}
  .card .next{margin-top:6px;font-size:12px;padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .empty{color:var(--sub);font-size:12.5px;padding:10px 2px;border:1px dashed var(--line);border-radius:10px;text-align:center}
  footer{padding:0 28px 28px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Job Hunt OS</h1>
    <p>Pipeline, Kanban-style — generated from <code>pipeline/*.md</code></p>
  </div>
  <span class="badge" id="modeBadge">loading…</span>
</header>
<div id="board"></div>
<footer id="generatedAt"></footer>

<script>
const STAGE_META = {
  Researching: { color: "var(--stage-researching)" },
  Applied:     { color: "var(--stage-applied)" },
  Screen:      { color: "var(--stage-screen)" },
  Interview:   { color: "var(--stage-interview)" },
  Final:       { color: "var(--stage-final)" },
  Offer:       { color: "var(--stage-offer)" },
  Closed:      { color: "var(--stage-closed)" },
};

async function loadData() {
  // Real local data first (gitignored, never leaves this machine's dashboard build).
  try {
    const r = await fetch("./data.local.json", { cache: "no-store" });
    if (r.ok) return { data: await r.json(), mode: "live" };
  } catch (_) {}
  const r2 = await fetch("./data.json", { cache: "no-store" });
  return { data: await r2.json(), mode: "sample" };
}

function render(data, mode) {
  const board = document.getElementById("board");
  const badge = document.getElementById("modeBadge");
  const gen = document.getElementById("generatedAt");
  badge.textContent = mode === "live" ? "live pipeline data" : "sample data — demo only";
  gen.textContent = data.generated_at ? `Generated ${new Date(data.generated_at).toLocaleString()}` : "";

  const stages = data.stages || Object.keys(STAGE_META);
  const byStage = Object.fromEntries(stages.map((s) => [s, []]));
  for (const app of data.applications || []) {
    (byStage[app.stage] || byStage[stages[0]]).push(app);
  }

  board.innerHTML = "";
  for (const stage of stages) {
    const col = document.createElement("div");
    col.className = "col";
    const color = (STAGE_META[stage] || {}).color || "var(--sub)";
    const apps = byStage[stage] || [];
    col.innerHTML = `
      <div class="col-head">
        <span class="dot" style="background:${color}"></span>
        <h2>${stage}</h2>
        <span class="count">${apps.length}</span>
      </div>
      <div class="cards">
        ${apps.length ? apps.map(cardHTML).join("") : `<div class="empty">Nothing here yet</div>`}
      </div>
    `;
    board.appendChild(col);
  }
}

function cardHTML(app) {
  const meta = [app.applied_date, app.contact].filter(Boolean).join(" · ");
  return `
    <div class="card">
      <div class="company">${escapeHTML(app.company)}</div>
      <div class="role">${escapeHTML(app.role)}</div>
      ${meta ? `<div class="meta"><span>${escapeHTML(meta)}</span></div>` : ""}
      ${app.next_action ? `<div class="next">${escapeHTML(app.next_action)}${app.next_action_date ? " · " + escapeHTML(app.next_action_date) : ""}</div>` : ""}
    </div>
  `;
}

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

loadData().then(({ data, mode }) => render(data, mode));
</script>
</body>
</html>
